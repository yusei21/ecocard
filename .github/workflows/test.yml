name: Testar lógica do EcoCard
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          node --check card-art.js
          node --check tests/card-art.test.cjs
          node --check kids-game.js
          node --check tests/kids-game.test.cjs
          node --check joker-feedback.js
          node --check tests/joker-feedback.test.cjs
          node --check orientation-hint.js
          node --check tests/orientation-hint.test.cjs
          node --check solo-v2.js
          node --check tests/solo.test.cjs
          node --check tests/decks.test.cjs
          node --check hand-order.js
          node --check tests/hand-order.test.cjs
      - name: Executar testes de combos e coringas
        run: |
          node tests/card-art.test.cjs
          node tests/kids-game.test.cjs
          node tests/joker-feedback.test.cjs
          node tests/orientation-hint.test.cjs
          node tests/solo.test.cjs
          node tests/decks.test.cjs
          node tests/hand-order.test.cjs
